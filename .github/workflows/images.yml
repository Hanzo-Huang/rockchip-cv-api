name: Model images

on:
  pull_request:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      model:
        description: Catalog ID (empty builds every model)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: model-images-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

jobs:
  catalog:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.catalog.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - id: catalog
        env:
          MODEL_ID: ${{ inputs.model }}
        run: |
          python3 tools/models.py validate
          args=()
          if [ -n "$MODEL_ID" ]; then args=(--model "$MODEL_ID"); fi
          matrix=$(python3 tools/models.py matrix "${args[@]}")
          python3 -c '
          import json, sys
          models = json.load(sys.stdin)["include"]
          groups = []
          for chip in ("rk3576", "rk3588"):
              group = [model for model in models if model["tag"].startswith(chip + "-")]
              if group:
                  groups.append({"chip": chip, "models": json.dumps({"include": group})})
          print("matrix=" + json.dumps({"include": groups}, separators=(",", ":")))
          ' <<< "$matrix" >> "$GITHUB_OUTPUT"

  runtime:
    needs: catalog
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
        with:
          # Use the runner network for the BuildKit daemon's DNS forwarding.
          driver-opts: network=host
      - name: Build shared native engine and runtime
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          platforms: linux/arm64
          push: false
          cache-from: type=gha,scope=runtime
          cache-to: type=gha,mode=max,scope=runtime

  build:
    name: Build ${{ matrix.chip }} images
    needs: [catalog, runtime]
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.catalog.outputs.matrix) }}
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/build-model-images.yml
    with:
      models: ${{ matrix.models }}
